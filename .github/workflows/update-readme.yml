name: Update README Activity

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
  workflow_dispatch:

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    name: Update activity and stats
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update recent activity
        run: python3 scripts/update_activity.py
        env:
          GH_USERNAME: SachinK862007
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update stats card
        run: python3 scripts/generate_stats.py
        env:
          GH_USERNAME: SachinK862007
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update recent activity and stats"
            git pull --rebase
            git push
          fi
